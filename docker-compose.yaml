version: '3.8'

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__WEBSERVER__SECRET_KEY: 'bionicpro_secret_key_2026'
    _PIP_ADDITIONAL_REQUIREMENTS: ''
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/dags/sql:/opt/airflow/dags/sql
    - ./airflow/requirements.txt:/opt/airflow/requirements.txt
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - airflow_network

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - airflow_network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
     REACT_APP_API_URL: http://localhost:8083
     REACT_APP_BACKEND_URL: http://localhost:8083
     REACT_APP_AUTH_URL: http://localhost:8082
     REACT_APP_KEYCLOAK_URL: http://localhost:8080
     REACT_APP_KEYCLOAK_REALM: reports-realm
     REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend
    networks:
      - airflow_network

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: "passthrough"
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
    networks:
      - airflow_network

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    container_name: bionicpro-auth
    ports:
      - "8082:8082"
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - REPORTS_API_URL=http://backend:8000
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080
      - KEYCLOAK_ISSUER_URI=http://localhost:8080/realms/reports-realm
      - KEYCLOAK_EXTERNAL_URL=http://localhost:8080
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      - keycloak
      - redis
    networks:
      - airflow_network
    restart: unless-stopped

  openldap:
    image: symas/openldap:latest
    container_name: openldap-bionicpro
    ports:
      - "1389:1389"
      - "1636:1636"
    environment:
      LDAP_ROOT: "dc=example,dc=com"
      LDAP_DOMAIN: "example.com"
      LDAP_ORGANISATION: "BionicPRO International"
      LDAP_ADMIN_PASSWORD: admin
      LDAP_ALLOW_ANON_BINDING: "no"
      LDAP_CUSTOM_LDIF_DIR: "/ldifs"
      LDAP_SKIP_DEFAULT_TREE: "yes"
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
      - ./ldap/config.ldif:/ldifs/50-bootstrap.ldif:ro
    restart: unless-stopped
    networks:
      - airflow_network

  crm_db:
    image: postgres:14
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    volumes:
      - ./crm-db:/docker-entrypoint-initdb.d
      - ./postgres-crm-data:/var/lib/postgresql/data
    command: postgres -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    ports:
      - "5444:5432"
    networks:
      - airflow_network

  olap_db:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9431:9000"
    volumes:
      - ./clickhouse-data:/var/lib/clickhouse
      - ./olap-db:/docker-entrypoint-initdb.d
      - ./olap-db:/var/lib/clickhouse/user_files
      - ./olap-db/users.xml:/etc/clickhouse-server/users.d/users.xml
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - airflow_network

  clickhouse-init:
    image: clickhouse/clickhouse-server:latest
    platform: linux/arm64
    container_name: clickhouse-init
    depends_on:
      olap_db:
        condition: service_healthy
    volumes:
      - ./olap-db:/scripts:ro
    command: >
      bash -c '
        echo "=== Ожидаем готовности ClickHouse ===" &&
        until clickhouse-client --host olap_db --query "SELECT 1" > /dev/null 2>&1; do
          echo "ClickHouse ещё не готов... ждём 2 секунды";
          sleep 2;
        done &&
        echo "=== ClickHouse готов. Выполняем инициализацию ===" &&

        for script in $(ls /scripts/*.sql | sort); do
          if [ -f "$$script" ]; then
            echo "→ Выполняем: $$(basename "$$script")";
            clickhouse-client \
              --host olap_db \
              --multiquery \
              --query "$$(cat "$$script")" || echo "⚠️ Ошибка в $$(basename "$$script")";
          fi
        done &&

        echo "=== Инициализация ClickHouse завершена успешно ==="
      '
    restart: "no"
    networks:
      - airflow_network

  backend:
    build:
      context: ./report-backend
      dockerfile: Dockerfile
    container_name: bionicpro-backend
    ports:
      - "8000:8000"
    environment:
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: bionicpro
      CLICKHOUSE_HOST: olap_db
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minio_user
      MINIO_SECRET_KEY: minio_password
      MINIO_BUCKET: bionicpro-reports
      MINIO_SECURE: false
      AUTH_SERVICE_URL: http://bionicpro-auth:8082
      PUBLIC_MINIO_URL: http://localhost:8083
    depends_on:
      olap_db:
        condition: service_healthy
    networks:
      - airflow_network
    restart: unless-stopped

  postgres-airflow:
    image: postgres:16-alpine
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - airflow_network

  airflow-init:
    <<: *airflow-common
    command: bash -c "airflow db init && airflow users create --username admin --firstname Admin --lastname Admin --role Admin --email admin@sample.ru --password admin"
    restart: "no"
    depends_on:
      postgres-airflow:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8090:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    command: server --console-address ":9001" /data
    networks:
      - airflow_network

  nginx-cdn:
    image: nginx:alpine
    container_name: nginx-cdn
    ports:
      - "8083:8083"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - bionicpro-auth
      - backend
      - minio
    networks:
      - airflow_network
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    networks:
      - airflow_network
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for MinIO to be ready...' &&
        until (/usr/bin/mc alias set local http://minio:9000 minio_user minio_password); do
          echo '...waiting for MinIO...' && sleep 2;
        done &&
      
        echo 'Creating bucket bionicpro-reports...' &&
        /usr/bin/mc mb local/bionicpro-reports --ignore-existing &&
      
        echo 'MinIO initialization completed successfully!'
      "
  redis:
    image: redis:7-alpine
    container_name: redis-session
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - airflow_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - airflow_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - airflow_network

  debezium:
    image: debezium/connect:2.5
    container_name: debezium
    depends_on:
      - kafka
      - zookeeper
    ports:
      - "8084:8083"
    environment:
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium
    networks:
      - airflow_network

  debezium-init:
    image: curlimages/curl:latest
    container_name: debezium-init
    depends_on:
      - crm_db
      - kafka
      - debezium
      - olap_db
    volumes:
      - ./debezium/init-connector.sh:/init-connector.sh:ro
    command: sh /init-connector.sh
    networks:
      - airflow_network
    restart: on-failure

volumes:
  postgres-keycloak-data:
  redis-data:
  ldap-data:
  ldap-config:
  minio_storage: {}
  airflow_postgres_data:
  clickhouse-data:
  nginx-cache:

networks:
  airflow_network:
    driver: bridge